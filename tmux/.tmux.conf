# Prefix: C-a (home row, easier than C-b)
set-option -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# Windows start at 1
set -g base-index 1

# Neovim needs these
set -sg escape-time 10
set-option -g focus-events on

# Scrollback
set-option -g history-limit 100000

# Easy config reload
bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

bind-key e refresh-client
bind-key space next-window
bind-key bspace previous-window
bind-key enter next-layout

# Vim-like splits (opens in current path)
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Window management
unbind q
bind-key q kill-window
bind-key r command-prompt -I "#W" "rename-window '%%'"

# Lazygit popup
bind-key g display-popup -d '#{pane_current_path}' -w 80% -h 80% -E 'lazygit'

# Vi copy mode with clipboard
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe 'xclip -in -selection clipboard &> /dev/null'
bind -T copy-mode-vi Enter send-keys -X cancel

# Mouse
set -g mouse on

# Activity notifications
set -g visual-activity on

# No repeat delay after window switch
set-option -g repeat-time 0

# ── Status Bar (Gruvbox Dark Hard) ────────────────────────────────────────────
set-option -g status-left '#S | '
set -g status-right "%H:%M | %d-%m-%Y"

set-option -g status-style "fg=#bdae93,bg=#1d2021"
set-window-option -g window-status-style "fg=#bdae93,bg=default"
set-window-option -g window-status-current-style "fg=#fabd2f,bg=default"
set-option -g message-style "fg=#d5c4a1,bg=#3c3836"
set-option -g display-panes-active-colour "#b8bb26"
set-option -g display-panes-colour "#fabd2f"
set-window-option -g clock-mode-colour "#b8bb26"
set-window-option -g mode-style "fg=#bdae93,bg=#504945"
set-window-option -g window-status-bell-style "fg=#1d2021,bg=#fb4934"

# ── Pane borders ──────────────────────────────────────────────────────────────
set-option -g pane-border-style "fg=#3c3836"
set-option -g pane-active-border-style "fg=#504945"

# ── Plugins ───────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
