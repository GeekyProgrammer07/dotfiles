# Font
font_family           JetBrainsMono Nerd Font Mono
font_size             10.0

# No padding (let Neovim fill the terminal)
window_padding_width  0

# Scrollback
scrollback_lines      10000

# Cursor
cursor_shape          block

# Performance
sync_to_monitor       yes
update_check_interval 0

# Disable bells and decorations
enable_audio_bell     no
visual_bell_duration  0.0
window_border_width   0
draw_minimal_borders  yes
hide_window_decorations yes

# Window size — don't restore remembered size (breaks on multi-monitor changes)
remember_window_size  no
initial_window_width  100c
initial_window_height 30c

# Fullscreen toggle
map f11 toggle_fullscreen

# Colorscheme (Gruvbox Dark Hard)
background            #1d2021
foreground            #ebdbb2
selection_background  #d65d0e
selection_foreground  #fbf1c7
color0   #282828
color1   #cc241d
color2   #98971a
color3   #d79921
color4   #458588
color5   #b16286
color6   #689d6a
color7   #a89984
color8   #928374
color9   #fb4934
color10  #b8bb26
color11  #fabd2f
